# REFERENCE ONLY for Nex-Z/XiaoAiAgent. This project's CLI does not load it.
# Source inspected: c856d2a39d156299d0b7e50a84e6421834a64004 (2026-10-25).
# Requires a separate Python >=3.12 environment and langchain-ollama.
# Verify account, playback and stop behavior on each device/firmware.
# Copy/adapt settings into upstream config.yaml; see docs/experiments/003-bridge.md.
llm:
  provider: "ollama"
  api_key: ""
  model: "REPLACE_WITH_OLLAMA_LIST_MODEL"
  base_url: "http://localhost:11434"

xiaomi:
  username: "${MI_USER}"
  password: "${MI_PASS}"
  # Set MI_DID after --list-devices; don't auto-select another account device.
  did: "${MI_DID}"
  hardware: "L05C"
  use_command: true
  # Stop native playback after an accepted trigger; polling can leave a prefix.
  mute_xiaoai: true
  trigger_word: "帮我"
  tts_command: [5, 3]
  wake_command: [5, 4]
  debug: false
  polling_interval: 1.0

server:
  host: "127.0.0.1"
  port: 8000

# No external tool servers in the initial voice experiment.
mcp_servers: []
