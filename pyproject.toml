[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoai-lab"
version = "0.1.0"
description = "Read-only diagnostics and experiments for XiaoAi Play Enhanced L05C"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Resker666"}]
dependencies = []

[project.scripts]
xiaoai-lab = "xiaoai_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
